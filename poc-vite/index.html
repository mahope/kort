<!doctype html>
<html lang="da" data-brand="mahoje" class="font-vars">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kort.mahoje.dk - Gratis Topografisk Kortudskrivning</title>
    <meta name="description" content="Gratis webapplikation til udskrivning af danske topografiske kort som PDF." />
    <link rel="icon" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>(function(){try{var t=localStorage.getItem('theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.classList.add('dark')}catch(e){}})()</script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
