# kort-tiles: static PMTiles for kort.mahoje.dk / kort.solaris.dk.
# Range requests are built into nginx; the browser reads bits of the file.
server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Range, If-Match" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
        try_files $uri =404;
    }
    location = /health { return 200 "ok\n"; }
}
