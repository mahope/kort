services:
  kort:
    build:
      context: .
      args:
        NEXT_PUBLIC_BRAND: ${NEXT_PUBLIC_BRAND:-mahoje}
        NEXT_PUBLIC_DATAFORSYNINGEN_TOKEN: ${NEXT_PUBLIC_DATAFORSYNINGEN_TOKEN:-}
        NEXT_PUBLIC_ADRESSEVAELGER_TOKEN: ${NEXT_PUBLIC_ADRESSEVAELGER_TOKEN:-}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BRAND=${NEXT_PUBLIC_BRAND:-mahoje}
      - NEXT_PUBLIC_DATAFORSYNINGEN_TOKEN=${NEXT_PUBLIC_DATAFORSYNINGEN_TOKEN:-}
      - NEXT_PUBLIC_ADRESSEVAELGER_TOKEN=${NEXT_PUBLIC_ADRESSEVAELGER_TOKEN:-}
    restart: unless-stopped
    expose:
      - "3000"
